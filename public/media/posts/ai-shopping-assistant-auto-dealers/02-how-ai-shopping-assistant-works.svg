<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg2)" rx="0"/>

  <!-- Title -->
  <text x="600" y="50" fill="#0f172a" font-size="28" font-weight="700" text-anchor="middle">How an AI Shopping Assistant Works</text>
  <text x="600" y="78" fill="#64748b" font-size="16" font-weight="400" text-anchor="middle">From shopper question to qualified lead in seconds</text>

  <!-- Step 1: Shopper Types -->
  <g filter="cardShadow" transform="translate(30, 110)">
    <rect x="0" y="0" width="200" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="100" cy="50" r="28" fill="url(#blue)"/>
    <text x="100" y="57" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">1</text>
    <text x="100" y="102" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Shopper Asks</text>
    <!-- Chat bubble icon -->
    <g transform="translate(55, 120)">
      <rect x="0" y="0" width="90" height="32" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="21" fill="#3b82f6" font-size="11" font-weight="500">"Family SUV</text>
    </g>
    <g transform="translate(55, 160)">
      <rect x="0" y="0" width="90" height="32" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="10" y="21" fill="#3b82f6" font-size="11" font-weight="500">under $40k"</text>
    </g>
    <text x="100" y="230" fill="#64748b" font-size="12" text-anchor="middle">Natural language.</text>
    <text x="100" y="248" fill="#64748b" font-size="12" text-anchor="middle">No filters needed.</text>
  </g>

  <!-- Arrow 1→2 -->
  <g transform="translate(230, 240)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6,4"/>
    <polygon points="40,-6 52,0 40,6" fill="#cbd5e1"/>
  </g>

  <!-- Step 2: AI Understands -->
  <g filter="cardShadow" transform="translate(270, 110)">
    <rect x="0" y="0" width="200" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="100" cy="50" r="28" fill="url(#purple)"/>
    <text x="100" y="57" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">2</text>
    <text x="100" y="102" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">AI Understands</text>
    <!-- Brain/parsing visual -->
    <g transform="translate(30, 120)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="10" y="19" fill="#7c3aed" font-size="11" font-weight="500">"family" → 3-row</text>
    </g>
    <g transform="translate(30, 156)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="10" y="19" fill="#7c3aed" font-size="11" font-weight="500">"SUV" → body type</text>
    </g>
    <g transform="translate(30, 192)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1"/>
      <text x="10" y="19" fill="#7c3aed" font-size="11" font-weight="500">"$40k" → max price</text>
    </g>
    <text x="100" y="255" fill="#64748b" font-size="12" text-anchor="middle">Parses intent into</text>
    <text x="100" y="273" fill="#64748b" font-size="12" text-anchor="middle">inventory attributes.</text>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(470, 240)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6,4"/>
    <polygon points="40,-6 52,0 40,6" fill="#cbd5e1"/>
  </g>

  <!-- Step 3: Searches Inventory -->
  <g filter="cardShadow" transform="translate(510, 110)">
    <rect x="0" y="0" width="200" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="100" cy="50" r="28" fill="url(#green)"/>
    <text x="100" y="57" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">3</text>
    <text x="100" y="102" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Searches Inventory</text>
    <!-- Database/inventory icon -->
    <g transform="translate(40, 124)">
      <rect x="0" y="0" width="120" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="8" y="15" fill="#059669" font-size="10" font-weight="500">Tahoe LT · 28k mi</text>
    </g>
    <g transform="translate(40, 154)">
      <rect x="0" y="0" width="120" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="8" y="15" fill="#059669" font-size="10" font-weight="500">Explorer XLT · 12k mi</text>
    </g>
    <g transform="translate(40, 184)">
      <rect x="0" y="0" width="120" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="8" y="15" fill="#059669" font-size="10" font-weight="500">Pilot EX-L · 19k mi</text>
    </g>
    <g transform="translate(40, 214)">
      <rect x="0" y="0" width="120" height="22" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
      <text x="8" y="15" fill="#16a34a" font-size="10" font-weight="400">+ 5 more matches</text>
    </g>
    <text x="100" y="268" fill="#64748b" font-size="12" text-anchor="middle">Real-time. Always</text>
    <text x="100" y="286" fill="#64748b" font-size="12" text-anchor="middle">up to date.</text>
  </g>

  <!-- Arrow 3→4 -->
  <g transform="translate(710, 240)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6,4"/>
    <polygon points="40,-6 52,0 40,6" fill="#cbd5e1"/>
  </g>

  <!-- Step 4: Answers Shopper -->
  <g filter="cardShadow" transform="translate(750, 110)">
    <rect x="0" y="0" width="200" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="100" cy="50" r="28" fill="url(#orange)"/>
    <text x="100" y="57" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">4</text>
    <text x="100" y="102" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Answers Shopper</text>
    <!-- Answer bubbles -->
    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="160" height="44" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="12" y="19" fill="#92400e" font-size="11" font-weight="500">Matches shown with</text>
      <text x="12" y="35" fill="#92400e" font-size="11" font-weight="500">price, miles, features</text>
    </g>
    <g transform="translate(20, 176)">
      <rect x="0" y="0" width="160" height="44" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
      <text x="12" y="19" fill="#92400e" font-size="11" font-weight="500">"Does it have a</text>
      <text x="12" y="35" fill="#92400e" font-size="11" font-weight="500">sunroof?" → Yes!</text>
    </g>
    <text x="100" y="255" fill="#64748b" font-size="12" text-anchor="middle">Instant, accurate</text>
    <text x="100" y="273" fill="#64748b" font-size="12" text-anchor="middle">answers from data.</text>
  </g>

  <!-- Arrow 4→5 -->
  <g transform="translate(950, 240)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="6,4"/>
    <polygon points="40,-6 52,0 40,6" fill="#cbd5e1"/>
  </g>

  <!-- Step 5: Lead Captured -->
  <g filter="cardShadow" transform="translate(980, 110)">
    <rect x="0" y="0" width="200" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="100" cy="50" r="28" fill="url(#red)"/>
    <text x="100" y="57" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">5</text>
    <text x="100" y="102" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Lead Captured</text>
    <!-- Lead score visual -->
    <g transform="translate(30, 124)">
      <rect x="0" y="0" width="140" height="80" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="70" y="22" fill="#dc2626" font-size="10" font-weight="600" text-anchor="middle">LEAD SCORE</text>
      <text x="70" y="52" fill="#dc2626" font-size="28" font-weight="800" text-anchor="middle">87</text>
      <text x="70" y="70" fill="#ef4444" font-size="10" font-weight="500" text-anchor="middle">HIGH INTENT</text>
    </g>
    <g transform="translate(30, 216)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
      <text x="70" y="19" fill="#dc2626" font-size="11" font-weight="600" text-anchor="middle">→ Routed to Sales</text>
    </g>
    <text x="100" y="278" fill="#64748b" font-size="12" text-anchor="middle">Auto-qualified.</text>
  </g>

  <!-- Bottom caption -->
  <text x="600" y="470" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Every step happens in real time. No forms. No waiting. No missed leads.</text>
</svg>