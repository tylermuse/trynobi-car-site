<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="chatBubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#162d4a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Left side: Text content -->
  <text x="80" y="200" fill="#94a3b8" font-size="16" font-weight="500" letter-spacing="3">DEALER TECHNOLOGY</text>
  <text x="80" y="260" fill="#ffffff" font-size="48" font-weight="700">AI Shopping</text>
  <text x="80" y="320" fill="#ffffff" font-size="48" font-weight="700">Assistants</text>
  <text x="80" y="365" fill="#3b82f6" font-size="28" font-weight="600">for Auto Dealers</text>
  <text x="80" y="420" fill="#94a3b8" font-size="18" font-weight="400">How conversational AI helps car shoppers</text>
  <text x="80" y="450" fill="#94a3b8" font-size="18" font-weight="400">find the right vehicle and buy faster.</text>

  <!-- Right side: Chat interface mockup -->
  <g filter="shadow" transform="translate(640, 80)">
    <!-- Phone/browser frame -->
    <rect x="0" y="0" width="480" height="470" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect x="0" y="0" width="480" height="52" rx="16" fill="#1e293b"/>
    <rect x="0" y="36" width="480" height="16" fill="#1e293b"/>
    <circle cx="24" cy="26" r="6" fill="#3b82f6"/>
    <text x="42" y="31" fill="#e2e8f0" font-size="15" font-weight="600">AI Shopping Assistant</text>
    <circle cx="440" cy="26" r="4" fill="#22c55e"/>
    <text x="448" y="31" fill="#22c55e" font-size="11">Online</text>

    <!-- User message bubble -->
    <g transform="translate(140, 75)">
      <rect x="0" y="0" width="320" height="56" rx="12" fill="#3b82f6"/>
      <text x="16" y="24" fill="#ffffff" font-size="13.5" font-weight="400">Show me SUVs good for a family</text>
      <text x="16" y="44" fill="#ffffff" font-size="13.5" font-weight="400">of 5 with less than 35k miles</text>
    </g>

    <!-- AI response bubble -->
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="380" height="130" rx="12" fill="url(#chatBubbleGrad)" stroke="#2d4a6f" stroke-width="0.5"/>
      <text x="16" y="26" fill="#94a3b8" font-size="11" font-weight="500">Found 8 matching vehicles:</text>

      <!-- Vehicle card 1 -->
      <rect x="16" y="40" width="348" height="34" rx="6" fill="#1e3a5f"/>
      <text x="28" y="62" fill="#e2e8f0" font-size="12.5" font-weight="500">2023 Chevy Tahoe LT · 28k mi · $42,900</text>
      <circle cx="346" cy="57" r="4" fill="#3b82f6"/>

      <!-- Vehicle card 2 -->
      <rect x="16" y="82" width="348" height="34" rx="6" fill="#1e3a5f"/>
      <text x="28" y="104" fill="#e2e8f0" font-size="12.5" font-weight="500">2024 Ford Explorer XLT · 12k mi · $38,500</text>
      <circle cx="346" cy="99" r="4" fill="#3b82f6"/>
    </g>

    <!-- Second user message -->
    <g transform="translate(180, 310)">
      <rect x="0" y="0" width="280" height="40" rx="12" fill="#3b82f6"/>
      <text x="16" y="26" fill="#ffffff" font-size="13.5" font-weight="400">Does the Tahoe have a sunroof?</text>
    </g>

    <!-- AI answer -->
    <g transform="translate(20, 370)">
      <rect x="0" y="0" width="320" height="56" rx="12" fill="url(#chatBubbleGrad)" stroke="#2d4a6f" stroke-width="0.5"/>
      <text x="16" y="24" fill="#e2e8f0" font-size="13" font-weight="400">Yes! This Tahoe LT has a power</text>
      <text x="16" y="44" fill="#e2e8f0" font-size="13" font-weight="400">sliding sunroof. Want to schedule a</text>
    </g>

    <!-- Typing input bar -->
    <rect x="16" y="440" width="448" height="18" rx="9" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="28" y="453" fill="#475569" font-size="11">Ask about any vehicle...</text>
  </g>

  <!-- Accent line -->
  <rect x="80" y="490" width="120" height="3" rx="1.5" fill="url(#accentGrad)"/>
</svg>